# GitHub Actions workflow for deploying Vite React App to GitHub Pages
# Repository: Arjun64594/portfolio-
# Actions URL: https://github.com/Arjun64594/portfolio-/actions
# Target Site URL: https://arjun64594.github.io/portfolio-/

name: Deploy Portfolio to GitHub Pages

on:
  # Triggers the workflow on push to main or master branch
  push:
    branches:
      - main
      - master

  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Vite application
        env:
          # Sets base path for GitHub Pages repository subdirectory
          VITE_BASE_PATH: /portfolio-/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
